[package]
name = "shoji-bar-4"
version = "0.1.0"
edition = "2024"
description = "A Material 3 Expressive desktop shell for ShojiWM, built on AntiWebUI"
license = "MIT OR Apache-2.0"

[dependencies]
anti-webui = { git = "https://github.com/bea4dev/AntiWebUI.git", branch = "main", features = ["wayland-shell", "shell-niri", "shell-network", "shell-battery", "shell-power-profiles", "shell-bluetooth", "shell-media", "shell-notifications", "shell-tray", "shell-session", "shell-audio", "shell-apps", "shell-process", "shell-system"] }
anti-webui-md3e = { git = "https://github.com/bea4dev/AntiWebUI.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
zbus = "5"
futures-lite = "2"
async-channel = "2"
rustix = { version = "1", features = ["net", "event", "pipe", "fs", "process"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
tempfile = "3"
libloading = "0.8.9"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
getrandom = "0.3"
zeroize = "1"
async-io = "2"

[dev-dependencies]
wayland-server = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["server"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }

[features]
## Links AntiWebUI dynamically for faster rebuilds while developing.
dynamic_linking = ["anti-webui/dynamic_linking"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
# Function names stay, for `scripts/cpu-report.sh`; the debug info goes.
strip = "debuginfo"
